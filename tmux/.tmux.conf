set -g mouse on

set -g prefix C-Space
bind Space send-prefix


bind-key v split-window -h -l 90 -c '#{pane_current_path}'
bind-key s split-window -v -l 20 -c '#{pane_current_path}'
bind-key V split-window -h -c '#{pane_current_path}'
bind-key S split-window -v -c '#{pane_current_path}'
bind-key c new-window -c "#{pane_current_path}"

bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D
setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key f display-popup -E 'selected="$(tmux capture-pane -J -p -S -100000 | fzf --tac --preview "printf %s {}" || true)"; [ -n "$selected" ] && printf %s "$selected" | pbcopy && tmux display-message "Copied to clipboard"'
unbind-key -T prefix p
bind-key p run "pbpaste | tmux load-buffer - && tmux paste-buffer"
bind-key ] run "pbpaste | tmux load-buffer - && tmux paste-buffer"

bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

bind -n M-Left previous-window
bind -n M-Right next-window

bind -n C-S-Right  switchc -n
bind -n C-S-Left  switchc -p
bind -n C-S-F2 new-session

bind-key r source-file ~/.tmux.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'

# run-shell 'powerline-config tmux setup'

run '~/.tmux/plugins/tpm/tpm'

set-option -g default-terminal "screen-256color"

set -sg escape-time 10
set -g status on
set -g status-interval 5
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 100

set -g status-left "#[fg=#181825,bg=#89b4fa,bold] #S "
set -g status-right "#[fg=#a6adc8,bg=#181825]#{pane_current_command}  #[fg=#f9e2af,bg=#181825]%H:%M "

set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#181825,bg=#a6e3a1,bold] #I:#W "
set -g window-status-style "fg=#a6adc8,bg=#181825"
set -g window-status-current-style "fg=#181825,bg=#a6e3a1"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
